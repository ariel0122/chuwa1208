<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="common.css" rel="stylesheet" />
</head>

<body>
    <div class="container mt-4">
        <!-- nav bar -->
        <div class="d-flex justify-content-end mb-3" id="navArea"></div>

        <h2 class="text-center mb-4 page-title">Shopping Platform</h2>

        <div id="alertBox"></div>

        <!-- profile -->
        <div id="profileSection" class="card shadow-lg p-4 mx-auto mb-4 d-none" style="max-width: 700px">
            <h5 class="mb-3">My Profile</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="profileEmail" class="form-control" disabled />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="profileUsername" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Shipping Address</label>
                    <input type="text" id="profileShipping" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Billing Address</label>
                    <input type="text" id="profileBilling" class="form-control" />
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Payment Method</label>
                    <input type="text" id="profilePayment" class="form-control" />
                </div>
            </div>

            <button class="btn btn-primary" onclick="updateProfile()">
                Update Profile
            </button>
        </div>

        <!-- item list -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Product List</h4>
            <button id="addItemBtn" class="btn btn-success d-none" data-bs-toggle="modal"
                data-bs-target="#addItemModal">
                Add Item
            </button>
        </div>

        <div id="itemList" class="row"></div>
    </div>

    <!-- Create Item Modal -->
    <div class="modal fade" id="addItemModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Add Product</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input class="form-control mb-2" id="newName" placeholder="Name" />
                    <input class="form-control mb-2" id="newPrice" type="number" placeholder="Price" />
                    <input class="form-control mb-2" id="newInventory" type="number" placeholder="Inventory" />
                    <input class="form-control mb-2" id="newUpc" placeholder="UPC" />
                    <input class="form-control mb-2" id="newImage" placeholder="Image URL" />
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="createItem()">
                        Create
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const ITEM_BASE = "http://localhost:8082";

        function isLoggedIn() {
            return !!getToken();
        }

        function getRole() {
            return localStorage.getItem("role");
        }

        function isAdmin() {
            return getRole() === "ADMIN";
        }

        // init

        window.onload = async () => {
            renderNav();
            if (isLoggedIn()) {
                document.getElementById("profileSection").classList.remove("d-none");

                if (isAdmin()) {
                    document.getElementById("addItemBtn").classList.remove("d-none");
                }

                loadProfile();
            }
            loadItems();
        };

        // navigation

        function renderNav() {
            const nav = document.getElementById("navArea");
            if (isLoggedIn()) {
                nav.innerHTML = `
                    <button class="btn btn-outline-secondary me-2"
                        onclick="goOrders()">Order Management</button>

                     <button class="btn btn-outline-info me-2"
                        onclick="getPayments()">Payment Management</button>

                    <button class="btn btn-outline-danger"
                        onclick="logout()">Logout</button>
                `;
            } else {
                nav.innerHTML = `
                    <button class="btn btn-outline-primary me-2" onclick="goLogin()">Login</button>
                    <button class="btn btn-primary" onclick="goRegister()">Register</button>
                `;
            }
        }

        function goOrders() {
            window.location.href = "orders.html";
        }

        function getPayments() {
            window.location.href = "payments.html";
        }

        const ORDER_BASE = "http://localhost:8083";

        async function orderItem(id) {

            const qty = document.getElementById("qty-" + id).value;

            const token = getToken();

            const res = await fetch(
                ORDER_BASE + "/orders?itemId=" + id + "&quantity=" + qty,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const result = await res.json();

            if (result.code === 200) {
                showAlert("Order created");
            } else {
                showAlert(result.message, "danger");
            }
        }

        // product list

        async function loadItems() {
            const res = await fetch(ITEM_BASE + "/items");
            const result = await res.json();

            const container = document.getElementById("itemList");
            container.innerHTML = "";

            result.data.forEach((item) => {
                let orderSection = "";

                if (isLoggedIn() && item.inventory > 0) {
                    orderSection = `
                <div class="input-group mt-2">
                    <input type="number" min="1" max="${item.inventory}"
                           class="form-control" id="qty-${item.id}" placeholder="Qty">
                    <button class="btn btn-primary"
                        onclick="orderItem('${item.id}')">
                        Order
                    </button>
                </div>
            `;
                }

                container.innerHTML += `
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <img src="${item.imageUrl}" class="card-img-top" style="height:200px;object-fit:cover">
                    <div class="card-body">
                        <h5>${item.name}</h5>
                        <p>Price: ¥${item.price}</p>
                        <p>Stock: ${item.inventory}</p>
                        ${orderSection}
                    </div>
                </div>
            </div>
        `;
            });
        }

        // Order item

        async function orderItem(id) {
            const qty = document.getElementById("qty-" + id).value;
            if (!qty || qty <= 0) return showAlert("Invalid quantity", "danger");

            const token = getToken();

            const res = await fetch(
                ORDER_BASE + "/orders?itemId=" + id + "&quantity=" + qty,
                {
                    method: "POST",
                    headers: {
                        Authorization: "Bearer " + token,
                    },
                }
            );

            const result = await res.json();
            if (result.code === 200) {
                showAlert("Order success");
                loadItems();
            } else {
                showAlert(result.message, "danger");
            }
        }

        // Create new item (for admin)

        async function createItem() {

            const name = newName.value.trim();
            const price = newPrice.value;
            const inventory = newInventory.value;
            const upc = newUpc.value.trim();
            const image = newImage.value.trim();

            // validation
            if (!name) {
                return showAlert("Item name is required", "danger");
            }

            if (!price || price <= 0) {
                return showAlert("Price must be greater than 0", "danger");
            }

            if (inventory === "" || inventory < 0) {
                return showAlert("Inventory must be 0 or greater", "danger");
            }

            if (!upc) {
                return showAlert("UPC is required", "danger");
            }

            const token = getToken();

            const res = await fetch(ITEM_BASE + "/items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + token,
                },
                body: JSON.stringify({
                    name: name,
                    price: parseFloat(price),
                    inventory: parseInt(inventory),
                    upc: upc,
                    imageUrl: image
                }),
            });

            const result = await res.json();

            if (result.code === 200) {
                showAlert("Item created");

                loadItems();

                bootstrap.Modal.getInstance(
                    document.getElementById("addItemModal")
                ).hide();

                // clear form
                newName.value = "";
                newPrice.value = "";
                newInventory.value = "";
                newUpc.value = "";
                newImage.value = "";
            } else {
                showAlert(result.message, "danger");
            }
        }

        // Profile

        async function loadProfile() {
            const token = getToken();
            const response = await fetch(BASE_URL + "/account/me", {
                headers: { Authorization: "Bearer " + token },
            });

            if (response.status !== 200) return logout();

            const result = await response.json();
            const user = result.data;

            setRole(user.role);

            profileEmail.value = user.email;
            profileUsername.value = user.username;
            profileShipping.value = user.shippingAddress;
            profileBilling.value = user.billingAddress;
            profilePayment.value = user.paymentMethod;
        }

        async function updateProfile() {
            const token = getToken();

            const response = await fetch(BASE_URL + "/account/me", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + token,
                },
                body: JSON.stringify({
                    username: profileUsername.value,
                    shippingAddress: profileShipping.value,
                    billingAddress: profileBilling.value,
                    paymentMethod: profilePayment.value,
                }),
            });

            const result = await response.json();
            result.code === 200
                ? showAlert("Profile updated!")
                : showAlert(result.message, "danger");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
