<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Order Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <div class="d-flex justify-content-between mb-3">

            <h3>Order Management</h3>

            <div>
                <button class="btn btn-secondary me-2" onclick="goHome()">Back</button>
                <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
            </div>

        </div>

        <div id="alertBox"></div>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Item Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Order Time</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="orderTable"></tbody>

        </table>

    </div>


    <script src="common.js"></script>

    <script>

        const ORDER_BASE = "http://localhost:8083";

        function getRole() {
            return localStorage.getItem("role");
        }

        function isAdmin() {
            return getRole() === "ADMIN";
        }

        window.onload = () => {
            loadOrders();
        };

        function goHome() {
            window.location.href = "index.html";
        }

        function formatTime(t) {

            const date = new Date(t);

            return date.toLocaleString();
        }

        function statusBadge(status) {

    if (status === "CREATED")
        return `<span class="badge bg-secondary">CREATED</span>`;

    if (status === "PAID")
        return `<span class="badge bg-success">PAID</span>`;

    if (status === "CANCELLED")
        return `<span class="badge bg-danger">CANCELLED</span>`;

    if (status === "REFUNDED")
        return `<span class="badge bg-warning text-dark">REFUNDED</span>`;

    if (status === "FINISHED")
        return `<span class="badge bg-primary">FINISHED</span>`;

    return `<span class="badge bg-dark">${status}</span>`;
}

        async function loadOrders() {

            const token = getToken();

            const res = await fetch(ORDER_BASE + "/orders", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const result = await res.json();

            const orders = result.data;

            const table = document.getElementById("orderTable");

            table.innerHTML = "";

            orders.forEach(o => {

                let action = "";

                if (o.status === "CREATED") {
                    action = `<button class="btn btn-warning btn-sm"
onclick="cancelOrder('${o.id}')">Cancel</button>`;
                }

                if (o.status === "PAID") {

                    if (isAdmin()) {

                        action = `
        <button class="btn btn-success btn-sm"
        onclick="finishOrder('${o.id}')">
        Finish
        </button>`;

                    } else {

                        action = `
        <button class="btn btn-danger btn-sm"
        onclick="refundOrder('${o.id}')">
        Refund
        </button>`;

                    }

                }

                table.innerHTML += `

<tr>

<td>${o.id}</td>
<td>${o.userId}</td>
<td>${o.itemName}</td>
<td>${o.price}</td>
<td>${o.quantity}</td>
<td>${o.amount}</td>
<td>${statusBadge(o.status)}</td>
<td>${formatTime(o.createdAt)}</td>
<td>${action}</td>

</tr>

`;

            });

        }


        async function cancelOrder(id) {

            const token = getToken();

            const res = await fetch(
                ORDER_BASE + "/orders/cancel?id=" + id,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const result = await res.json();

            if (result.code === 200) {

                showAlert("Order cancelled");

                loadOrders();

            } else {

                showAlert(result.message, "danger");

            }

        }

        async function refundOrder(id) {

            const token = getToken();

            const res = await fetch(
                ORDER_BASE + "/orders/refund?id=" + id,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const result = await res.json();

            if (result.code === 200) {

                showAlert("Refund success");

                loadOrders();

            } else {

                showAlert(result.message, "danger");

            }

        }

        async function finishOrder(id) {

            const token = getToken();

            const res = await fetch(
                ORDER_BASE + "/orders/finish?id=" + id,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const result = await res.json();

            if (result.code === 200) {

                showAlert("Order finished");

                loadOrders();

            } else {

                showAlert(result.message, "danger");

            }

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
