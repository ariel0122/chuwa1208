<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Account System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4 page-title">Account Management</h2>
    <div id="alertBox"></div>

    <div class="card shadow-lg p-4 mx-auto" style="max-width: 500px;">
        <h4 class="mb-4 text-center">Register</h4>

        <div class="mb-3">
            <input type="email" id="regEmail" class="form-control" placeholder="Email">
        </div>

        <div class="mb-3">
            <input type="text" id="regUsername" class="form-control" placeholder="Username">
        </div>

        <div class="mb-3">
            <input type="password" id="regPassword" class="form-control" placeholder="Password">
        </div>

        <div class="mb-3">
            <input type="text" id="regShipping" class="form-control" placeholder="Shipping Address">
        </div>

        <div class="mb-3">
            <input type="text" id="regBilling" class="form-control" placeholder="Billing Address">
        </div>

        <div class="mb-3">
            <input type="text" id="regPayment" class="form-control" placeholder="Payment Method">
        </div>

        <button class="btn btn-success w-100 mb-3" onclick="register()">Register</button>

        <div class="text-center">
            <button class="btn btn-link" onclick="goLogin()">Back to login</button>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
async function register() {
    const response = await fetch(BASE_URL + "/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: regEmail.value,
            username: regUsername.value,
            password: regPassword.value,
            shippingAddress: regShipping.value,
            billingAddress: regBilling.value,
            paymentMethod: regPayment.value
        })
    });

    const result = await response.json();

    if (result.code === 200) {
        showAlert("Registered successfully!");
        setTimeout(goLogin, 1500);
    } else {
        showAlert(result.message, "danger");
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
