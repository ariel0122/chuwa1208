<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Account System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4 page-title">Account Management</h2>
    <div id="alertBox"></div>

    <div class="card shadow-lg p-4 mx-auto" style="max-width: 450px;">
        <h4 class="mb-4 text-center">Login</h4>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control">
        </div>

        <button class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

        <div class="text-center">
            <button class="btn btn-link" onclick="goRegister()">Create account</button>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
async function login() {
    const response = await fetch(BASE_URL + "/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: loginEmail.value,
            password: loginPassword.value
        })
    });

    const result = await response.json();

    if (result.code === 200) {
        setToken(result.data);
        goProfile();
    } else {
        showAlert(result.message, "danger");
    }
}

window.onload = () => {
    if (getToken()) goProfile();
};
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
